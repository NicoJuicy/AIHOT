name: Feature request
description: Propose a feature or improvement with a clear use case.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas still being explored can start in the [Ideas discussions](https://github.com/KKKKhazix/AIHOT/discussions/categories/ideas).
        This repository doesn't provide a complete production source list, and doesn't maintain dedicated collectors for platforms such as Weibo or Xiaohongshu; see the [sources docs](https://github.com/KKKKhazix/AIHOT/blob/main/docs/sources.md) for bringing in results from external collectors.
        A feature only your site needs can be built as a module in `modules/` of your own repository; see the [architecture docs](https://github.com/KKKKhazix/AIHOT/blob/main/docs/architecture.md#modules).
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem
      description: Who needs it, and in what situation? What is inconvenient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior or result you'd like to see; concrete examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried (optional)
      description: Why don't existing settings, scripts or other approaches meet the need?
