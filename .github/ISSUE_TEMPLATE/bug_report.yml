name: Bug report
description: Report a reproducible bug to help us find and fix it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For deployment and usage questions, start in the [Q&A discussions](https://github.com/KKKKhazix/AIHOT/discussions/categories/q-a).
        Report security vulnerabilities through [private vulnerability reporting](https://github.com/KKKKhazix/AIHOT/security/advisories/new).
        Do not upload a full .env, API keys, admin passwords, cookies or a production database.
  - type: input
    id: revision
    attributes:
      label: Code version
      description: Run git rev-parse --short HEAD in the repository directory; if unsure, give the date you downloaded or updated it. Repositories created with "Use this template" have commit hashes that don't match this repository, so give the creation date or the date you last synced from this repository.
      placeholder: Commit hash, or the date you downloaded, created or synced
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS, Docker or local deployment, and relevant versions; for web page issues, include the browser.
      placeholder: Ubuntu / macOS; Docker Compose / Node.js; behind a reverse proxy or not; whether you changed related settings.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Which page, command or action does it start from? Give the fewest steps that reproduce the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual result
      placeholder: Expected ...; actual ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots (optional)
      description: Paste only the relevant parts, and remove keys, passwords, cookies and personal information first. It's fine to submit without logs.
